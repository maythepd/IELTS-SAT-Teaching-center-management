services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: vela-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  vela-web:
    build:
      context: ./IELTS-SAT-Teaching-center-management-main/project/vela-web
      dockerfile: Dockerfile
    container_name: vela-web
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BACKEND_PORT=4000
      - APP_URL=http://localhost:3000
      - API_UPSTREAM=http://127.0.0.1:4000
      - DB_SERVER=sqlserver
      - DB_PORT=1433
      - DB_NAME=TeachingCenter
      - DB_USER=sa
      - DB_PASSWORD=YourStrong@Password123
      - DB_AUTH=sql
      - DB_ENCRYPT=true
      - DB_TRUST_SERVER_CERTIFICATE=true
      - MFA_REQUIRED=false
      - DEMO_PASSWORD=DemoPassword@123
      - AUTO_MIGRATE=true
      - AUTO_SEED=true
    ports:
      - "3000:3000"
      - "4000:4000"
    volumes:
      - vela_data:/app/backend/data
    restart: unless-stopped

volumes:
  mssql_data:
  vela_data:
